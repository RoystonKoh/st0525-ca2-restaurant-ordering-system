<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Restaurant Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/member/products">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <a class="nav-link text-light me-3" href="/member/my-feedback">My Feedback</a>
        <a class="nav-link text-light me-3 position-relative" href="/member/cart">Cart <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span></a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4 mb-5">
    <div id="page-message" class="alert d-none" role="alert"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="h3 mb-1">Available Products</h1>
        <p class="text-muted mb-0">Add one or more items, then review them in your cart before checkout.</p>
      </div>
      <a href="/member/cart" class="btn btn-primary">Review Cart</a>
    </div>

    <div id="product-grid" class="row g-3"></div>
    <div id="no-products" class="alert alert-info mt-3 d-none">No products are available at the moment.</div>
  </main>

  <script src="/js/cart-ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await refreshCartBadge();
      await fetchProducts();
    });

    async function fetchProducts() {
      try {
        const data = await getJson('/products');
        const grid = document.getElementById('product-grid');
        const products = data.products || [];

        if (products.length === 0) {
          document.getElementById('no-products').classList.remove('d-none');
          return;
        }

        grid.innerHTML = products.map((product) => `
          <div class="col-md-6 col-lg-4">
            <article class="card h-100">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between gap-2 align-items-start mb-2">
                  <span class="badge bg-secondary">${escapeHtml(product.category || 'Uncategorised')}</span>
                  <span class="badge ${product.is_available ? 'bg-success' : 'bg-secondary'}">${product.is_available ? 'Available' : 'Unavailable'}</span>
                </div>
                <h2 class="h5">${escapeHtml(product.name)}</h2>
                <p class="text-muted small flex-grow-1">${escapeHtml(product.description || 'No description provided.')}</p>
                <p class="h4 mb-3">$${Number(product.price).toFixed(2)}</p>
                <div class="input-group mb-2">
                  <label class="visually-hidden" for="quantity-${product.product_id}">Quantity for ${escapeHtml(product.name)}</label>
                  <input id="quantity-${product.product_id}" type="number" min="1" value="1" class="form-control" ${product.is_available ? '' : 'disabled'}>
                  <button class="btn btn-success" onclick="addToCart(${product.product_id})" ${product.is_available ? '' : 'disabled'}>Add to Cart</button>
                </div>
                <a href="/member/product-detail?id=${product.product_id}" class="btn btn-outline-secondary btn-sm">View Details and Feedback</a>
              </div>
            </article>
          </div>
        `).join('');
      } catch (error) {
        showPageMessage(error.message || 'Failed to load products.', 'danger');
      }
    }

    async function addToCart(productId) {
      const quantity = Number(document.getElementById(`quantity-${productId}`).value);
      if (!Number.isInteger(quantity) || quantity < 1) {
        showPageMessage('Quantity must be a whole number of at least 1.', 'warning');
        return;
      }

      try {
        await getJson('/cart/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ product_id: productId, quantity }),
        });
        showPageMessage('Item added to your cart.', 'success');
        await refreshCartBadge();
      } catch (error) {
        showPageMessage(error.message, 'danger');
      }
    }
  </script>
</body>
</html>
