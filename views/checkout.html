<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Restaurant Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/member/products">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <a class="nav-link text-light me-3" href="/member/products">Products</a>
        <a class="nav-link text-light me-3 position-relative" href="/member/cart">Cart <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span></a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4 mb-5">
    <div id="page-message" class="alert d-none" role="alert"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="h3 mb-1">Checkout</h1>
        <p class="text-muted mb-0">Confirm your order. The database validates all items and creates the order atomically.</p>
      </div>
      <a href="/member/cart" class="btn btn-outline-secondary">Back to Cart</a>
    </div>
    <div id="checkout-content"></div>
  </main>

  <script src="/js/cart-ui.js"></script>
  <script>
    let checkoutReady = false;

    document.addEventListener('DOMContentLoaded', loadCheckout);

    async function loadCheckout() {
      try {
        const data = await getJson('/checkout/preview');
        const cart = data.cart;
        checkoutReady = data.can_checkout;
        await refreshCartBadge();

        if (!cart.items.length) {
          document.getElementById('checkout-content').innerHTML = `
            <div class="card"><div class="card-body text-center py-5">
              <h2 class="h5">There is nothing to check out</h2>
              <p class="text-muted">Your cart is empty.</p>
              <a href="/member/products" class="btn btn-primary">Browse Products</a>
            </div></div>`;
          return;
        }

        document.getElementById('checkout-content').innerHTML = `
          <div class="row g-4">
            <section class="col-lg-8"><div class="card"><div class="card-body">
              <h2 class="h5">Order Items</h2>
              <ul class="list-group list-group-flush">${cart.items.map((item) => `
                <li class="list-group-item px-0 d-flex justify-content-between align-items-center">
                  <span><strong>${escapeHtml(item.product.name)}</strong><br><span class="small text-muted">Quantity: ${item.quantity} × $${Number(item.product.price).toFixed(2)}</span></span>
                  <strong>$${Number(item.subtotal).toFixed(2)}</strong>
                </li>`).join('')}</ul>
            </div></div></section>
            <aside class="col-lg-4"><div class="card"><div class="card-body">
              <h2 class="h5">Payment Summary</h2>
              <div class="d-flex justify-content-between mb-2"><span>Total items</span><span>${cart.item_count}</span></div>
              <div class="d-flex justify-content-between h5"><span>Total</span><span>$${Number(cart.total_amount).toFixed(2)}</span></div>
              <p class="small text-muted">This assessment implementation records an order only; no external payment data is collected.</p>
              <button id="confirm-checkout" class="btn btn-success w-100" ${checkoutReady ? '' : 'disabled'}>Confirm and Place Order</button>
            </div></div></aside>
          </div>`;

        if (!checkoutReady) {
          showPageMessage('Checkout is unavailable because one or more items are no longer available. Return to your cart to correct it.', 'warning');
        } else {
          document.getElementById('confirm-checkout').addEventListener('click', placeOrder);
        }
      } catch (error) {
        showPageMessage(error.message, 'danger');
      }
    }

    async function placeOrder() {
      if (!checkoutReady) return;
      const button = document.getElementById('confirm-checkout');
      button.disabled = true;
      button.textContent = 'Placing Order…';

      try {
        const data = await getJson('/checkout', { method: 'POST' });
        await refreshCartBadge();
        document.getElementById('checkout-content').innerHTML = `
          <div class="card border-success"><div class="card-body text-center py-5">
            <h2 class="h4 text-success">Order Placed Successfully</h2>
            <p>Your order <strong>#${data.order.order_id}</strong> has ${data.order.item_count} item(s) and a total of <strong>$${Number(data.order.total_amount).toFixed(2)}</strong>.</p>
            <p class="text-muted">Status: ${escapeHtml(data.order.status)}. An administrator may update its status from the dashboard.</p>
            <a href="/member/products" class="btn btn-primary">Continue Shopping</a>
          </div></div>`;
        showPageMessage(data.message, 'success');
      } catch (error) {
        button.disabled = false;
        button.textContent = 'Confirm and Place Order';
        showPageMessage(error.message, 'danger');
      }
    }
  </script>
</body>
</html>
