<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | Restaurant Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container">
    <a class="navbar-brand" href="/cart/create">Restaurant Ordering System</a>
    <div class="navbar-nav ms-auto align-items-center">
      <a class="nav-link text-light me-3" href="/cart/create">Add Items</a>
      <a class="nav-link text-light me-3" href="/member/my-feedback">My Feedback</a>
      <a class="nav-link text-light me-3 position-relative" href="/cart/retrieve/all">Cart <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span></a>
      <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
  </div></nav>

  <main class="container mt-4 mb-5">
    <div id="page-message" class="alert d-none" role="alert"></div>
    <div class="d-flex justify-content-between align-items-center mb-3"><div>
      <h1 class="h3 mb-1">Shopping Cart</h1>
      <p class="text-muted mb-0">Update items, select one optional voucher, and review automatic discounts and delivery pricing calculated by the back end.</p>
    </div><a href="/cart/create" class="btn btn-outline-secondary">Add Items</a></div>
    <div id="cart-content"></div>
  </main>

  <script src="/js/cart-ui.js"></script>
  <script>
    let currentCart;
    let voucherOptions = [];
    document.addEventListener('DOMContentLoaded', loadCart);
    const money = (value) => `$${Number(value || 0).toFixed(2)}`;

    async function loadCart() {
      try {
        const [cartData, voucherData] = await Promise.all([getJson('/cart'), getJson('/cart/vouchers')]);
        currentCart = cartData.cart;
        voucherOptions = voucherData.vouchers || [];
        renderCart();
        await refreshCartBadge();
      } catch (error) { showPageMessage(error.message, 'danger'); }
    }

    function voucherOption(voucher, selectedCode) {
      const selected = voucher.code === selectedCode ? 'selected' : '';
      return `<option value="${escapeHtml(voucher.code)}" ${selected}>${escapeHtml(voucher.code)} — ${escapeHtml(voucher.name)}</option>`;
    }

    function renderVoucherSection(summary) {
      const selected = summary.selected_voucher;
      const selectedCode = selected?.code || '';
      const options = voucherOptions.map((voucher) => voucherOption(voucher, selectedCode)).join('');
      return `<section class="border rounded p-3 mb-3 bg-light">
        <h3 class="h6 mb-2">Optional Voucher</h3>
        <label class="form-label small" for="voucher-select">Select one voucher</label>
        <select id="voucher-select" class="form-select form-select-sm" onchange="selectVoucher(this.value)">
          <option value="">No voucher</option>${options}
        </select>
        <p class="small text-muted mt-2 mb-0">Automatic discount and delivery rules still apply. A selected voucher is an additional customer choice.</p>
        ${selected ? `<div class="small mt-2"><strong>${escapeHtml(selected.code)}</strong><br>${escapeHtml(selected.message)}</div>` : ''}
      </section>`;
    }

    function renderCart() {
      const container = document.getElementById('cart-content');
      if (!currentCart.items.length) {
        container.innerHTML = '<div class="card"><div class="card-body text-center py-5"><h2 class="h5">Your cart is empty</h2><p class="text-muted">Add menu items before checkout.</p><a href="/cart/create" class="btn btn-primary">Add Items</a></div></div>';
        return;
      }
      const summary = currentCart.summary;
      const unavailable = currentCart.unavailable_item_count > 0;
      const ruleRows = summary.applied_rules.length ? summary.applied_rules.map((rule) =>
        `<li class="list-group-item px-0 small"><strong>${escapeHtml(rule.name)}</strong><br><span class="text-muted">${escapeHtml(rule.description)}</span>${rule.amount > 0 ? `<span class="float-end text-success">−${money(rule.amount)}</span>` : ''}</li>`
      ).join('') : '<li class="list-group-item px-0 small text-muted">No automatic pricing rule is currently eligible.</li>';
      const deliveryTier = summary.delivery_rule
        ? `${escapeHtml(summary.delivery_rule.name)} (${money(summary.delivery_tier_fee)} tier fee)`
        : 'No orderable items — no delivery fee';

      container.innerHTML = `<div class="row g-4">
        <section class="col-lg-8">
          ${unavailable ? `<div class="alert alert-warning"><strong>Partial-processing rule:</strong> ${currentCart.unavailable_item_count} unavailable item(s) are in the cart. Checkout will process available items and leave unavailable items in the cart.</div>` : ''}
          <div class="card"><div class="table-responsive"><table class="table align-middle mb-0">
            <thead><tr><th>Product</th><th>Unit Price</th><th style="min-width:155px">Quantity</th><th>Subtotal</th><th>Action</th></tr></thead>
            <tbody>${currentCart.items.map((item) => `<tr class="${item.product.is_available ? '' : 'table-warning'}">
              <td><strong>${escapeHtml(item.product.name)}</strong><br><span class="small text-muted">${escapeHtml(item.product.category || 'Uncategorised')}</span><br><span class="badge bg-${item.product.is_available ? 'success' : 'warning text-dark'}">${item.product.is_available ? 'Available' : 'Unavailable — will remain after checkout'}</span></td>
              <td>${money(item.product.price)}</td>
              <td><div class="input-group input-group-sm"><button class="btn btn-outline-secondary" onclick="changeQuantity(${item.cart_item_id}, ${item.quantity - 1})">−</button><input class="form-control text-center" type="number" min="1" value="${item.quantity}" onchange="changeQuantity(${item.cart_item_id}, Number(this.value))"><button class="btn btn-outline-secondary" onclick="changeQuantity(${item.cart_item_id}, ${item.quantity + 1})">+</button></div></td>
              <td>${money(item.subtotal)}</td><td><button class="btn btn-sm btn-outline-danger" onclick="removeItem(${item.cart_item_id})">Delete</button></td>
            </tr>`).join('')}</tbody>
          </table></div></div>
        </section>
        <aside class="col-lg-4"><div class="card"><div class="card-body">
          <h2 class="h5">Cart Summary</h2>
          ${renderVoucherSection(summary)}
          <div class="d-flex justify-content-between mb-2"><span>All cart items</span><span>${money(currentCart.raw_items_total)}</span></div>
          ${unavailable ? `<div class="d-flex justify-content-between small text-warning mb-2"><span>Unavailable value (not ordered)</span><span>${money(summary.unavailable_items_value)}</span></div>` : ''}
          <div class="d-flex justify-content-between mb-2"><span>Orderable items subtotal</span><span>${money(summary.items_subtotal)}</span></div>
          <ul class="list-group list-group-flush mb-2">${ruleRows}</ul>
          <div class="d-flex justify-content-between text-success mb-2"><span>Automatic product/cart discounts</span><strong>−${money(summary.total_product_discount_amount)}</strong></div>
          ${summary.voucher_discount_amount > 0 ? `<div class="d-flex justify-content-between text-success mb-2"><span>Voucher item saving</span><strong>−${money(summary.voucher_discount_amount)}</strong></div>` : ''}
          <div class="d-flex justify-content-between border-top pt-2 mb-2"><span>Items after all discounts</span><span>${money(summary.items_total_after_voucher)}</span></div>
          <section class="border-top pt-2 mt-2">
            <h3 class="h6">Delivery / Service Pricing</h3>
            <div class="small text-muted mb-1">${deliveryTier}</div>
            <div class="d-flex justify-content-between small mb-1"><span>Standard delivery price</span><span>${money(summary.standard_delivery_fee)}</span></div>
            <div class="d-flex justify-content-between small mb-1"><span>Automatic delivery-tier saving</span><span class="text-success">−${money(summary.delivery_discount_amount)}</span></div>
            ${summary.voucher_delivery_saving > 0 ? `<div class="d-flex justify-content-between small mb-1"><span>Voucher delivery saving</span><span class="text-success">−${money(summary.voucher_delivery_saving)}</span></div>` : ''}
            <div class="d-flex justify-content-between fw-bold mb-2"><span>Final delivery / service fee</span><span>${money(summary.delivery_fee)}</span></div>
          </section>
          <hr><div class="d-flex justify-content-between h5"><span>Final total</span><span>${money(summary.final_total)}</span></div>
          <p class="small text-muted">${escapeHtml(summary.message)}</p>
          <a href="/member/checkout" class="btn btn-primary w-100 ${currentCart.items.length > 0 ? '' : 'disabled'}" aria-disabled="${currentCart.items.length === 0}">Proceed to Checkout</a>
        </div></div></aside>
      </div>`;
    }

    async function selectVoucher(voucherCode) {
      try {
        let data;
        if (!voucherCode) data = await getJson('/cart/voucher', { method: 'DELETE' });
        else data = await getJson('/cart/voucher', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ voucher_code: voucherCode }) });
        currentCart = data.cart;
        renderCart();
        showPageMessage(data.message, 'success');
      } catch (error) { showPageMessage(error.message, 'danger'); }
    }

    async function changeQuantity(cartItemId, quantity) {
      try {
        const data = await getJson(`/cart/items/${cartItemId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ quantity }) });
        currentCart = data.cart; renderCart(); await refreshCartBadge();
      } catch (error) { showPageMessage(error.message, 'danger'); }
    }

    async function removeItem(cartItemId) {
      try {
        const data = await getJson(`/cart/items/${cartItemId}`, { method: 'DELETE' });
        currentCart = data.cart; renderCart(); await refreshCartBadge();
      } catch (error) { showPageMessage(error.message, 'danger'); }
    }
  </script>
</body>
</html>
