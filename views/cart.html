<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | Restaurant Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/member/products">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <a class="nav-link text-light me-3" href="/member/products">Products</a>
        <a class="nav-link text-light me-3" href="/member/my-feedback">My Feedback</a>
        <a class="nav-link text-light me-3 position-relative" href="/member/cart">Cart <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span></a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4 mb-5">
    <div id="page-message" class="alert d-none" role="alert"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="h3 mb-1">Your Cart</h1>
        <p class="text-muted mb-0">Review quantities before proceeding to a secure, atomic checkout.</p>
      </div>
      <a href="/member/products" class="btn btn-outline-secondary">Continue Shopping</a>
    </div>

    <div id="cart-content"></div>
  </main>

  <script src="/js/cart-ui.js"></script>
  <script>
    let currentCart;

    document.addEventListener('DOMContentLoaded', loadCart);

    async function loadCart() {
      try {
        const data = await getJson('/cart');
        currentCart = data.cart;
        renderCart();
        await refreshCartBadge();
      } catch (error) {
        showPageMessage(error.message, 'danger');
      }
    }

    function renderCart() {
      const container = document.getElementById('cart-content');
      if (!currentCart.items.length) {
        container.innerHTML = `
          <div class="card"><div class="card-body text-center py-5">
            <h2 class="h5">Your cart is empty</h2>
            <p class="text-muted">Add products before you check out.</p>
            <a href="/member/products" class="btn btn-primary">Browse Products</a>
          </div></div>`;
        return;
      }

      const unavailable = currentCart.items.some((item) => !item.product.is_available);
      container.innerHTML = `
        <div class="row g-4">
          <section class="col-lg-8">
            <div class="card"><div class="table-responsive"><table class="table align-middle mb-0">
              <thead><tr><th>Product</th><th>Unit Price</th><th style="min-width: 160px">Quantity</th><th>Subtotal</th><th><span class="visually-hidden">Actions</span></th></tr></thead>
              <tbody>${currentCart.items.map((item) => `
                <tr>
                  <td><strong>${escapeHtml(item.product.name)}</strong><br><span class="small text-muted">${escapeHtml(item.product.category || 'Uncategorised')}</span>${item.product.is_available ? '' : '<br><span class="badge bg-danger">Unavailable</span>'}</td>
                  <td>$${Number(item.product.price).toFixed(2)}</td>
                  <td><div class="input-group input-group-sm"><button class="btn btn-outline-secondary" onclick="changeQuantity(${item.cart_item_id}, ${item.quantity - 1})" aria-label="Decrease quantity">−</button><input class="form-control text-center" id="quantity-${item.cart_item_id}" type="number" min="1" value="${item.quantity}" onchange="changeQuantity(${item.cart_item_id}, Number(this.value))"><button class="btn btn-outline-secondary" onclick="changeQuantity(${item.cart_item_id}, ${item.quantity + 1})" aria-label="Increase quantity">+</button></div></td>
                  <td>$${Number(item.subtotal).toFixed(2)}</td>
                  <td><button class="btn btn-sm btn-outline-danger" onclick="removeItem(${item.cart_item_id})">Remove</button></td>
                </tr>`).join('')}</tbody>
            </table></div></div>
          </section>
          <aside class="col-lg-4"><div class="card"><div class="card-body">
            <h2 class="h5">Order Summary</h2>
            <div class="d-flex justify-content-between"><span>Items (${currentCart.item_count})</span><strong>$${Number(currentCart.total_amount).toFixed(2)}</strong></div>
            <hr><div class="d-flex justify-content-between h5"><span>Total</span><span>$${Number(currentCart.total_amount).toFixed(2)}</span></div>
            ${unavailable ? '<div class="alert alert-warning small">Remove unavailable products before checkout.</div>' : ''}
            <a href="/member/checkout" class="btn btn-primary w-100 ${unavailable ? 'disabled' : ''}" aria-disabled="${unavailable}">Proceed to Checkout</a>
          </div></div></aside>
        </div>`;
    }

    async function changeQuantity(cartItemId, quantity) {
      if (!Number.isInteger(quantity) || quantity < 0) {
        showPageMessage('Quantity must be a whole number of at least 1.', 'warning');
        return;
      }
      try {
        const data = await getJson(`/cart/items/${cartItemId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ quantity }) });
        currentCart = data.cart;
        renderCart();
        await refreshCartBadge();
      } catch (error) {
        showPageMessage(error.message, 'danger');
      }
    }

    async function removeItem(cartItemId) {
      try {
        const data = await getJson(`/cart/items/${cartItemId}`, { method: 'DELETE' });
        currentCart = data.cart;
        renderCart();
        await refreshCartBadge();
      } catch (error) {
        showPageMessage(error.message, 'danger');
      }
    }
  </script>
</body>
</html>
